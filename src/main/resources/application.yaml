spring:
  application:
    name: routex

  kafka:
    bootstrap-servers: localhost:9092

    admin:
      fail-fast: true

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

      acks: all
      retries: 2147483647

      batch-size: 32768
      compression-type: zstd

      # Required for Kafka Transactions
      transaction-id-prefix: routex-tx-

      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 500

    consumer:
      group-id: routex-ride-request-logger
      auto-offset-reset: earliest

      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer

      properties:
        spring.json.trusted.packages: com.routex.dispatch,com.routex.matching

    listener:
      ack-mode: manual

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,configprops,beans

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: routex

logging:
  level:
    org.springframework.kafka: DEBUG

    org.apache.kafka.clients.Metadata: DEBUG
    org.apache.kafka.clients.NetworkClient: DEBUG
    org.apache.kafka.clients.producer.KafkaProducer: DEBUG
    org.apache.kafka.clients.producer.internals.TransactionManager: TRACE